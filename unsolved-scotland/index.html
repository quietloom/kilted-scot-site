<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsolved Scotland — kilted.scot</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;background:#f2efe8;color:#1d2a35;font-family:system-ui,sans-serif}
  header{background:#1d2a35;color:#f2efe8;padding:1.4rem 1.7rem;display:flex;align-items:center;gap:1rem}
  header img{width:38px;height:38px}
  header span{font-family:Georgia,serif;font-size:22px}
  main{padding:2rem}
  a{color:#5c3d86}
  .episode-card{border:1px solid #1d2a35;border-radius:4px;padding:1rem;margin-bottom:1rem}
  .episode-card img{max-width:100%;display:block;margin-bottom:.5rem}
  .coming-soon{font-size:.85rem;color:#5c3d86;font-weight:bold}
</style>
</head>
<body>
<header>
  <img src="/assets/brand/mark-dark.svg" alt="">
  <a href="/" style="color:#f2efe8;text-decoration:none"><span>kilted.scot</span></a>
</header>
<main>
  <h1>Unsolved Scotland</h1>
  <!-- Structural data-wiring only — visual design is a separate frontend-designer pass (see spec §5, §8). -->
  <div id="episodes"></div>
  <script>
    fetch('/unsolved-scotland/episodes.json')
      .then(function (r) { return r.json(); })
      .then(function (episodes) {
        var container = document.getElementById('episodes');
        episodes.sort(function (a, b) { return a.number - b.number; });
        episodes.forEach(function (ep) {
          var card = document.createElement('div');
          card.className = 'episode-card episode-' + ep.status;
          if (ep.status === 'published') {
            card.innerHTML =
              '<img src="' + ep.thumbnail + '" alt="">' +
              '<h2><a href="' + ep.url + '">' + ep.title + '</a></h2>' +
              '<p>' + ep.summary + '</p>';
          } else {
            card.innerHTML =
              '<h2>' + ep.title + '</h2>' +
              '<p>' + ep.summary + '</p>' +
              '<span class="coming-soon">Coming soon</span>';
          }
          container.appendChild(card);
        });
      });
  </script>
</main>
</body>
</html>
